: '+curM+' | backend: '+curB+' | '+curI;var mmap={webgl:'bweb',push:'bdx'};var bmap={gl:'bgl',d3d11:'bdx',vk:'bvk',gles:'bes'};for(var k in mmap){document.getElementById(mmap[k]).className=(k==curM)?'on':'';}for(var k2 in bmap){document.getElementById(bmap[k2]).className=(k2==curB)?'on':'';}}try{initGL();setStatus('webgl','d3d11','');err('page-ok');}catch(e){try{err('initGL:'+e);}catch(x){}}setInterval(async function(){if(!gl)return;try{if(mode=='webgl'){tick();tAcc+=0.033;render(tAcc);}else{var n=await frame();if(n>0){var img=new Image();img.src='frame_'+(n-1)+'.jpg?t='+Date.now();await img.decode();gl.bindTexture(gl.TEXTURE_2D,texImg);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,img);gl.viewport(0,0,CW,CH);drawQ(-1,-1,2,2,[1.0,1.0,1.0,1.0],2,[0,1],texImg,true);frames++;var el=(Date.now()-t0)/1000;document.getElementById('fps').textContent='frames: '+frames+'  ('+(frames/el).toFixed(1)+' fps)  mode: '+mode;}}}catch(e){}},33);setTimeout(function(){try{shutdown();}catch(e){}},60000);document.getElementById('bweb').onclick=async function(){var ok=await pick_webgl();if(ok){mode='webgl';setStatus('webgl',curB,curI);}};document.getElementById('bdx').onclick=async function(){var ok=await pick_d3d11();if(ok){mode='push';setStatus('push','d3d11',curI);}};document.getElementById('bgl').onclick=async function(){await pick_gl();setStatus(curM,curB,curI);};document.getElementById('bvk').onclick=async function(){await pick_vk();setStatus(curM,curB,curI);};document.getElementById('bes').onclick=async function(){await pick_gles();setStatus(curM,curB,curI);};document.getElementById('res').onchange=function(){var p=this.value.split(',');resizeCanvas(parseInt(p[0],10),parseInt(p[1],10));};})();</script></body></html>
