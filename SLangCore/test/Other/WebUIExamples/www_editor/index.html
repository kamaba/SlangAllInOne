<!doctype html>
<html>
<head>
  <meta charset=utf-8>
  <title>Text Editor</title>
  <script src="/webui.js"></script>
  <style>
    body{font-family:Arial,sans-serif;margin:0;background:#1e1e1e;color:#ddd}
    .bar{padding:8px;background:#2d2d2d}
    button{padding:6px 10px;margin-right:6px;background:#3a3a3a;color:#ddd;border:1px solid #555;cursor:pointer;border-radius:4px}
    #status{color:#9aa}
    textarea{width:100%;height:calc(100vh - 48px);box-sizing:border-box;border:0;
      background:#1e1e1e;color:#d4d4d4;font-family:Consolas,monospace;font-size:14px;padding:12px;resize:none}
  </style>
</head>
<body>
  <div class="bar">
    <button onclick="save()">Save</button>
    <span id="status"></span>
  </div>
  <textarea id="editor" placeholder="Type here..."></textarea>
  <script>
    async function save(){
      const txt = document.getElementById('editor').value;
      document.getElementById('status').innerText = 'chars: ' + txt.length;
    }
  </script>
</body>
</html>
